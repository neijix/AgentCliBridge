# Tag dotnet-vX.Y.Z (or run it by hand on an existing tag): tests, then publishes with the tag's version.
# Never a plain v* tag: those are the Python line's (branch python), and its updater reads the Latest release.
# - D3sk.AgentCli goes to GitHub Packages (the job's token) and to nuget.org through Trusted
#   Publishing: GitHub's OIDC token is exchanged for a one-hour nuget.org key, no stored API key.
#   The nuget.org policy names this repository and this file (publish.yml); see README "Release".
# Public repository: GitHub-hosted runners only, never a self-hosted one.
name: publish

on:
  push:
    tags: ['dotnet-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (dotnet-vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # nuget.org Trusted Publishing
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^dotnet-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a dotnet-vX.Y.Z tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#dotnet-v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test D3sk.AgentCli.slnx -c Release
      - name: Pack
        run: |
          rm -rf artifacts
          dotnet pack src/D3sk.AgentCli -c Release -o artifacts -p:Version="$VERSION"
      - name: Push to GitHub Packages
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          --api-key "$PACKAGES_TOKEN"
          --skip-duplicate
      # Asked for just before the push: the key lives one hour and each OIDC token buys one key.
      - name: nuget.org login (OIDC -> short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || github.repository_owner }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
